# \u041D\u0430\u0437\u0432\u0430\u043D\u0438\u0435 \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u044F
spring.application.name=dynamicRecommendations

# URL \u0434\u043B\u044F \u043F\u043E\u0434\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u044F \u043A \u0431\u0430\u0437\u0435 \u0434\u0430\u043D\u043D\u044B\u0445 H2
application.recommendations-db.url=jdbc:h2:file:./transaction.mv.db

# \u0412\u0442\u043E\u0440\u0430\u044F \u0411\u0414 (\u043E\u0441\u043D\u043E\u0432\u043D\u0430\u044F, read/write)
spring.datasource.url=jdbc:postgresql://localhost:5432/recommendations_db
spring.datasource.username=user_Recommend_db
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Liquibase \u0434\u043B\u044F \u0443\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u044F \u043C\u0438\u0433\u0440\u0430\u0446\u0438\u044F\u043C\u0438 \u0441\u0445\u0435\u043C\u044B \u0411\u0414
spring.liquibase.change-log=classpath:liquibase/changelog-master.yml

# H2 \u043A\u043E\u043D\u0441\u043E\u043B\u044C (\u0434\u043B\u044F \u043E\u0442\u043B\u0430\u0434\u043A\u0438)
